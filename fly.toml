# fly.toml app configuration file generated for openclaw-ton-agent on 2026-08-14T21:16:57+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openclaw-ton-agent'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # The scanner is a background worker: it must NOT be autostopped for lack of
  # inbound traffic. With 'stop' + min 0 the proxy scaled the app to zero.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  NODE_ENV = "production"
  TON_NETWORK = "mainnet"
  OBSERVE_ONLY = "true"
  SCAN_RADAR_INTERVAL_MS = "60000"
  SCAN_SNIPER_INTERVAL_MS = "10000"
  SCANNER_ENABLED = "true"
  SNIPER_ENABLED = "true"
  EXECUTION_MODE = "notify_only"
  GATES_G1_G3_ACK = "0"
  OPENCLAW_CONFIG_PATH = "./openclaw/openclaw.json"
  OPENCLAW_STATE_DIR = "/app/data/.openclaw"
  JOURNAL_DIR = "/app/data"
  DATA_DIR = "/app/data"
  # Base host only — the client appends /v2 itself (see buildTonapiUrl).
  TONAPI_BASE = "https://tonapi.io"
  TONCENTER_API_KEY = ""  # Set via secrets if needed
  KILL_SWITCH_URL = ""
  KILL_SWITCH_POLL_MS = "15000"
  CIRCUIT_BREAKER_DRAWDOWN_PCT = "20"
  MAX_OPEN_POSITIONS_PER_TIER = "3"
  DATABASE_URL = ""  # Set via secrets if using TimescaleDB
  SQLITE_PATH = "/app/data/agent.db"
  PUBLIC_WEBHOOK_URL = ""  # Set via secrets if needed
