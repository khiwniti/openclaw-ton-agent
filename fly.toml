# fly.toml app configuration file for openclaw-ton-agent
# Process groups: scanner (L1 read-only) + executor (L4 custody/execution) + api (L5 control plane)
# See https://fly.io/docs/reference/configuration/

app = 'openclaw-ton-agent'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

# Graceful shutdown configuration
kill_signal = "SIGTERM"
kill_timeout = "60s"

# Unified container runs scanner + executor via scripts/start-unified.sh
[[services]]
  processes = ["app"]
  internal_port = 8080
  protocol = "tcp"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"

[http_service]
  processes = ["app"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  NODE_ENV = "production"
  TON_NETWORK = "mainnet"
  OBSERVE_ONLY = "true"
  SCAN_RADAR_INTERVAL_MS = "60000"
  SCAN_SNIPER_INTERVAL_MS = "10000"
  SCANNER_ENABLED = "true"
  SNIPER_ENABLED = "true"
  EXECUTION_MODE = "notify_only"
  GATES_G1_G3_ACK = "0"
  OPENCLAW_CONFIG_PATH = "./openclaw/openclaw.json"
  OPENCLAW_STATE_DIR = "/app/data/.openclaw"
  JOURNAL_DIR = "/app/data"
  DATA_DIR = "/app/data"
  TONAPI_BASE = "https://tonapi.io/v2"
  KILL_SWITCH_POLL_MS = "15000"
  CIRCUIT_BREAKER_DRAWDOWN_PCT = "20"
  MAX_OPEN_POSITIONS_PER_TIER = "3"
  GATE_RISK_PER_TRADE_PCT = "0.01"
  GATE_VOL_FLOOR_PCT = "0.02"
  GATE_VOL_CAP_PCT = "0.25"
  GATE_ATR_PERIOD = "20"
  SQLITE_PATH = "/app/data/agent.db"
  GATED_DIR = "/app/data"
  ORDERS_OUT = "/app/data/orders-mainnet.ndjson"
  FILLS_OUT = "/app/data/fills-mainnet.ndjson"
  EXEC_HEALTH_PORT = "8081"
  API_PORT = "3000"
  API_HOST = "0.0.0.0"
  REDIS_URL = "redis://localhost:6379"
