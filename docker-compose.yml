services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://user:pass@postgres:5432/openclaw
      - TON_NETWORK=mainnet
      - OBSERVE_ONLY=true
      - EXECUTION_MODE=notify_only
    volumes:
      - ./openclaw:/app/openclaw
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: npm run api:start
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - TON_NETWORK=mainnet
      - OBSERVE_ONLY=true
      - SCAN_RADAR_INTERVAL_MS=60000
      - SCAN_SNIPER_INTERVAL_MS=10000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./openclaw:/app/openclaw
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: npm run scanner:start
    restart: unless-stopped

  executor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - TON_NETWORK=mainnet
      - OBSERVE_ONLY=true
      - EXECUTION_MODE=notify_only
      - REDIS_URL=redis://redis:6379
      - EXEC_HEALTH_PORT=8081
    volumes:
      - ./openclaw:/app/openclaw
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: npm run continuous
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: openclaw
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d openclaw"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
