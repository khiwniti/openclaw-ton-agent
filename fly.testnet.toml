app = 'openclaw-ton-agent-testnet'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'
  build-args = ['SKIP_TYPECHECK=true']

kill_signal = "SIGTERM"
kill_timeout = "60s"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health/ready"

[[services]]
  processes = ["app"]
  internal_port = 8080
  protocol = "tcp"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  NODE_ENV = "production"
  TON_NETWORK = "testnet"
  OBSERVE_ONLY = "false"
  SCAN_RADAR_INTERVAL_MS = "60000"
  SCAN_SNIPER_INTERVAL_MS = "10000"
  SCANNER_ENABLED = "true"
  SNIPER_ENABLED = "true"
  SCANNER_SOURCE = "tonapi"
  EXECUTION_MODE = "auto"
  GATES_G1_G3_ACK = "1"

  OPENCLAW_CONFIG_PATH = "./openclaw/openclaw.json"
  OPENCLAW_STATE_DIR = "/app/data/.openclaw"
  JOURNAL_DIR = "/app/data"
  DATA_DIR = "/app/data"
  TONAPI_BASE = "https://testnet.tonapi.io/v2"
  TON_RPC_ENDPOINT = "https://testnet.toncenter.com/api/v2/jsonRPC"
  LIVE_CONFIRM_FIRST_N_TRADES = "0"
  SIZE_CONFIRM_THRESHOLD_TON = "100"
  KILL_SWITCH_POLL_MS = "15000"
  CIRCUIT_BREAKER_DRAWDOWN_PCT = "20"
  MAX_OPEN_POSITIONS_PER_TIER = "3"
  GATE_RISK_PER_TRADE_PCT = "0.10"
  GATE_VOL_FLOOR_PCT = "0.01"
  GATE_VOL_CAP_PCT = "0.50"
  GATE_ATR_PERIOD = "20"
  GATE_TRADE_FLOOR_SCORE = "0"
  GATE_BANKROLL_TON = "2.0"
  GATE_TIER_LOW_CAP_TON = "0.2"
  GATE_TIER_MID_CAP_TON = "0.5"
  GATE_TIER_HIGH_CAP_TON = "1.0"
  GATE_MIN_RR = "1.0"
  GATE_MIN_WIN_PROBABILITY = "0.1"
  GATE_FEE_COVERAGE_MULT = "1"
  GATE_NETWORK_FEE_TON = "0.01"
  SQLITE_PATH = "/app/data/agent.db"
  GATED_DIR = "/app/data"
  ORDERS_OUT = "/app/data/orders-testnet.ndjson"
  FILLS_OUT = "/app/data/fills-testnet.ndjson"
  EXEC_HEALTH_PORT = "8081"
  API_PORT = "3000"
  API_HOST = "0.0.0.0"
  REDIS_URL = "redis://localhost:6379"
  DEX_FORWARD_CUSHION_TON = "0.05"
  DEX_EXIT_RESERVE_TON = "0.05"
  DEX_BANKROLL_FLOOR_TON = "0.05"
